  <title id="chart-title">Cabloy Locale Implementation Roadmap</title>
  <desc id="chart-desc">Implementation Roadmap. 6 formal WBS tasks. Current derived status reviewed 2026-10-25. Relative positions and overlap are illustrative; they are not calendar dates, duration, staffing, or concurrency commitments. Dependency readiness is not execution approval; descriptive gates still require review.</desc>
