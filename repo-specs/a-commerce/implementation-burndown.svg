<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1300" viewBox="0 0 1600 1300" role="img" aria-labelledby="chart-title chart-desc">
  <title id="chart-title">A-Commerce WBS Scope-Count Burndown</title>
  <desc id="chart-desc">A scope-count burndown reference for the A-Commerce approved Work Breakdown Structure. The derived status snapshot was last reviewed on 2026-08-15. It records 23 approved WBS items, 23 verified items, and zero remaining items. The horizontal axis is verified WBS-item count, not time. There is no historical status series, estimate, duration, staffing plan, delivery calendar, velocity measurement, or forecast in the source specifications.</desc>
  <metadata>
    WBS scope, dependencies, and completion checks: repo-specs/a-commerce/pdp-wbs.md.
    Derived current status: repo-specs/a-commerce/progress.md, last reviewed 2026-08-15.
    This is a scope-count reference, not a dated delivery trend. The source specifications
    provide no historical status series, actual dates, durations, estimates, staffing plan,
    calendar commitments, velocity measurement, or forecast.
  </metadata>
  <style>
    :root {
      --surface: #fcfcfb;
      --page: #f9f9f7;
      --ink: #0b0b0b;
      --secondary: #52514e;
      --muted: #898781;
      --grid: #e1e0d9;
      --axis: #c3c2b7;
      --blue: #2a78d6;
      --aqua: #1baf7a;
      --blue-wash: #eaf3fd;
      --aqua-wash: #e7f7f0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --surface: #1a1a19;
        --page: #0d0d0d;
        --ink: #ffffff;
        --secondary: #c3c2b7;
        --muted: #a09f99;
        --grid: #2c2c2a;
        --axis: #383835;
        --blue: #3987e5;
        --aqua: #199e70;
        --blue-wash: #172435;
        --aqua-wash: #122b23;
      }
    }
    .canvas { fill: var(--page); }
    .card { fill: var(--surface); stroke: var(--grid); stroke-width: 1; }
    .title { fill: var(--ink); font-family: Arial, Helvetica, sans-serif; font-size: 27px; font-weight: 700; letter-spacing: -0.5px; }
    .subtitle { fill: var(--secondary); font-family: Arial, Helvetica, sans-serif; font-size: 14px; }
    .heading { fill: var(--ink); font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 700; }
    .hero { fill: var(--ink); font-family: Arial, Helvetica, sans-serif; font-size: 54px; font-weight: 700; letter-spacing: -2px; }
    .metric { fill: var(--ink); font-family: Arial, Helvetica, sans-serif; font-size: 20px; font-weight: 700; }
    .caption { fill: var(--secondary); font-family: Arial, Helvetica, sans-serif; font-size: 11px; }
    .small { fill: var(--muted); font-family: Arial, Helvetica, sans-serif; font-size: 9px; }
    .axis-label { fill: var(--secondary); font-family: Arial, Helvetica, sans-serif; font-size: 10px; font-weight: 600; }
    .tick { fill: var(--secondary); font-family: Arial, Helvetica, sans-serif; font-size: 10px; font-variant-numeric: tabular-nums; }
    .table-head { fill: var(--muted); font-family: Arial, Helvetica, sans-serif; font-size: 9px; font-weight: 700; letter-spacing: 0.4px; }
    .table-text { fill: var(--ink); font-family: Arial, Helvetica, sans-serif; font-size: 11px; }
    .table-number { fill: var(--ink); font-family: Arial, Helvetica, sans-serif; font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .grid { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }
    .axis { stroke: var(--axis); stroke-width: 1; shape-rendering: crispEdges; }
    .reference { fill: none; stroke: var(--blue); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .meter-track { fill: var(--blue-wash); }
    .meter-fill { fill: var(--aqua); }
    .row:focus { outline: 2px solid var(--ink); outline-offset: 2px; }
  </style>

