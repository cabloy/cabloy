name: agent-governance

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PNPM_CONFIG_MINIMUM_RELEASE_AGE: 0
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: '12.14.0'
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: install root dependencies
        run: pnpm install --frozen-lockfile
      - name: install docs dependencies
        run: pnpm --dir repo-docs install --frozen-lockfile
      - name: verify agent-governance assets
        run: |
          npm run test:agent-governance
          npm run agent:governance:check
          npm run agent:governance:pack-check
          npm run test:spec-charts
          npm run spec:charts:check -- a-commerce
          npm run spec:charts:check -- home-user
      - name: build documentation
        run: npm run docs:build

  evidence-platforms:
    name: evidence paths (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: verify native evidence tooling
        run: node --test repo-agent-governance/tests/evidence-paths.test.mjs
      - name: verify sanitizer command entrypoint
        run: npm run --silent evidence:sanitize -- --help
      - name: verify checker command entrypoint
        run: npm run --silent evidence:check -- --help
