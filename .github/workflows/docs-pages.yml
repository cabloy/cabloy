name: docs-pages
on:
  push:
    branches:
      - main
    paths:
      - 'repo-docs/**'
      - 'repo-e2e/docs/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'README.md'
      - '.github/workflows/docs-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PNPM_CONFIG_MINIMUM_RELEASE_AGE: 0
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 11.5.2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: repo-docs/pnpm-lock.yaml
      - name: install root dependencies
        run: pnpm install --frozen-lockfile
      - name: install docs dependencies
        run: pnpm --dir repo-docs install --frozen-lockfile
      - name: install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: build docs and verify layout
        env:
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
        run: npm run test:docs:e2e
      - name: upload docs E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: docs-e2e-artifacts
          path: |
            repo-e2e/docs/playwright-report/
            repo-e2e/docs/test-results/
          if-no-files-found: ignore
      - name: setup pages
        uses: actions/configure-pages@v5
      - name: upload pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: repo-docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy to github pages
        id: deployment
        uses: actions/deploy-pages@v4
